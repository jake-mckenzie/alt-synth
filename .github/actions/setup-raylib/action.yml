name: Set up Raylib
description: Install the official prebuilt Raylib 5.5 static library
runs:
  using: composite
  steps:
    - name: Install native link dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: >-
        sudo apt-get update && sudo apt-get install --yes
        build-essential pkg-config libgl1-mesa-dev libx11-dev

    - name: Install the Unix Raylib archive
      if: runner.os != 'Windows'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) asset=raylib-5.5_linux_amd64.tar.gz ;;
          macOS) asset=raylib-5.5_macos.tar.gz ;;
          *) exit 1 ;;
        esac
        archive="$RUNNER_TEMP/$asset"
        curl --fail --location --retry 3 --output "$archive" \
          "https://github.com/raysan5/raylib/releases/download/5.5/$asset"
        mkdir -p .deps/raylib
        tar -xzf "$archive" -C .deps/raylib --strip-components=1
        if [ "$RUNNER_OS" = macOS ]; then
          lipo -verify_arch arm64 .deps/raylib/lib/libraylib.a
        fi

    - name: Install the Windows Raylib archive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $name = 'raylib-5.5_win64_mingw-w64'
        $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
        $unpacked = Join-Path $env:RUNNER_TEMP 'raylib-unpacked'
        Invoke-WebRequest -Uri "https://github.com/raysan5/raylib/releases/download/5.5/$name.zip" -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
        New-Item -ItemType Directory -Path .deps -Force | Out-Null
        Move-Item -LiteralPath (Join-Path $unpacked $name) -Destination .deps/raylib

    - name: Check Raylib files
      shell: bash
      run: |
        test -f .deps/raylib/include/raylib.h
        test -f .deps/raylib/lib/libraylib.a
        test -f .deps/raylib/LICENSE
