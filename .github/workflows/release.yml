name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test -f "docs/releases/$VERSION.md"

      - name: Set up Raylib
        uses: ./.github/actions/setup-raylib

      - name: Run core tests with sanitizers
        run: ./test.sh
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined

      - name: Build release binary
        run: |
          sh -n build.sh test.sh
          ./build.sh
          ./bin/alt-synth --help
        env:
          CFLAGS: -O2 -Werror
          LDFLAGS: -s

      - name: Package Linux release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/alt-synth/licenses dist/alt-synth/assets dist/alt-synth/docs/images
          cp bin/alt-synth dist/alt-synth/alt-synth
          cp README.md dist/alt-synth/README.md
          cp docs/playing-guide.md dist/alt-synth/docs/playing-guide.md
          cp assets/OFL.txt dist/alt-synth/assets/OFL.txt
          cp docs/images/piano-view.png docs/images/qwerty-view.png dist/alt-synth/docs/images/
          cp .deps/raylib/LICENSE dist/alt-synth/licenses/raylib-LICENSE.txt
          tar -czf "dist/alt-synth_${VERSION}_linux_x86_64.tar.gz" -C dist alt-synth
          cd dist
          sha256sum "alt-synth_${VERSION}_linux_x86_64.tar.gz" > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          release_flags=()
          latest=true
          title="alt-synth $VERSION"
          if [[ "$VERSION" == *-beta.* ]]; then
            release_flags+=(--prerelease)
            latest=false
            title+=" (Linux Beta)"
          fi
          gh release create "$VERSION" \
            "dist/alt-synth_${VERSION}_linux_x86_64.tar.gz" dist/checksums.txt \
            --verify-tag --draft --title "$title" "${release_flags[@]}" \
            --notes-file "docs/releases/$VERSION.md"
          gh release edit "$VERSION" --draft=false --latest="$latest"
