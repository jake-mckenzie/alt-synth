name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Raylib
        uses: ./.github/actions/setup-raylib

      - name: Test C core with sanitizers
        run: ./test.sh
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined

      - name: Build desktop app
        run: ./build.sh
        env:
          CFLAGS: -O2 -Werror

      - name: Check command-line help
        run: ./bin/alt-synth --help
